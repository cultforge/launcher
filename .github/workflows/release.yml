name: Build CultForge

# Tag or manual dispatch → Linux + macOS (+ optional Windows) installers.
# Windows day-to-day releases still use local `npm run release:windows`
# because frozen *.exe sidecars are gitignored.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v2.4.0)"
        required: true
        default: "v2.4.0"
      platforms:
        description: "Comma list: linux,macos,windows"
        required: true
        default: "linux,macos"

permissions:
  contents: write

jobs:
  # Build the matrix in a prior job — job-level `if` cannot reference `matrix`.
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import json, os

          event = os.environ["EVENT_NAME"]
          if event == "push":
              want = {"linux", "macos", "windows"}
              tag = os.environ["REF_NAME"]
          else:
              raw = os.environ.get("INPUT_PLATFORMS") or "linux,macos"
              want = {p.strip() for p in raw.split(",") if p.strip()}
              tag = os.environ.get("INPUT_TAG") or "v2.4.0"

          rows = [
              {
                  "id": "linux",
                  "platform": "ubuntu-22.04",
                  "args": "--bundles appimage,deb",
              },
              {
                  "id": "macos",
                  "platform": "macos-latest",
                  "args": "--bundles dmg",
              },
              {
                  "id": "windows",
                  "platform": "windows-latest",
                  "args": "--bundles msi,nsis",
              },
          ]
          include = [r for r in rows if r["id"] in want]
          include_json = json.dumps(include)
          print("platforms:", sorted(want))
          print("include:", include_json)
          print("tag:", tag)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"include={include_json}\n")
              f.write(f"tag={tag}\n")
          PY

  build:
    needs: select
    if: needs.select.outputs.include != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch companions (Phase 1–2)
        run: node scripts/fetch-companions.mjs

      - name: Prepare tauri.conf for this OS
        shell: bash
        env:
          MATRIX_ID: ${{ matrix.id }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const c = JSON.parse(fs.readFileSync(path, "utf8"));
          const id = process.env.MATRIX_ID;
          if (id === "linux") {
            c.bundle.targets = ["appimage", "deb"];
            // Phase 1–2: scanner + client (broker still Windows-only).
            c.bundle.resources = ["resources/scanner", "resources/client"];
          } else if (id === "macos") {
            c.bundle.targets = ["dmg"];
            c.bundle.resources = ["resources/scanner", "resources/client"];
          } else {
            c.bundle.targets = ["msi", "nsis"];
          }
          if (!process.env.TAURI_SIGNING_PRIVATE_KEY) {
            c.bundle.createUpdaterArtifacts = false;
          }
          fs.writeFileSync(path, JSON.stringify(c, null, 2) + "\n");
          console.log("Prepared", path, "for", id, "resources=", c.bundle.resources);
          NODE

      - name: Verify unix companions
        if: matrix.id != 'windows'
        shell: bash
        run: |
          test -f src-tauri/resources/scanner
          test -f src-tauri/resources/client
          chmod +x src-tauri/resources/scanner src-tauri/resources/client

      - name: Verify scanner companion (Windows)
        if: matrix.id == 'windows'
        shell: bash
        run: test -f src-tauri/resources/scanner.exe

      - name: Verify Windows sidecars
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          foreach ($n in @("client.exe","scanner.exe","ctfgbroker.exe")) {
            $p = "src-tauri/resources/$n"
            if (-not (Test-Path $p)) { throw "Missing $p" }
          }

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_WIX_SKIP_MSI_VALIDATION: "true"
        with:
          tagName: ${{ needs.select.outputs.tag }}
          releaseName: "CultForge ${{ needs.select.outputs.tag }}"
          releaseBody: "CultForge Launcher ${{ needs.select.outputs.tag }} (Windows + Linux + macOS)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
