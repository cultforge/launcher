name: Build client (Nuitka)

# Phase 2 — freeze client.py for Linux + macOS and attach to a client-v* release.
# Windows is NOT built here: freeze locally (`npm run sidecar:freeze`) and upload
# client.exe to the same release tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (client-v0.1.0)"
        required: true
        default: "client-v0.1.0"
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            client-v*) ;;
            *) echo "Tag must look like client-v0.1.0 (got: $TAG)"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  freeze-unix:
    needs: meta
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-22.04
            asset: client-linux-x86_64
          - id: macos-arm64
            os: macos-latest
            asset: client-macos-arm64
          - id: macos-x86_64
            os: macos-13
            asset: client-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build tools (Linux)
        if: matrix.id == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache patchelf

      - name: Install Nuitka deps
        run: |
          python -m pip install -U pip wheel
          python -m pip install nuitka ordered-set zstandard
          python -m pip install -r requirements.txt sniffio

      - name: Freeze client (Nuitka onefile)
        run: |
          set -euo pipefail
          mkdir -p dist-sidecar
          python -m nuitka \
            --lto=yes \
            --standalone \
            --onefile \
            --include-package=ctfgsdk \
            --include-package=uvicorn \
            --include-package=fastapi \
            --include-package=starlette \
            --include-package=pydantic \
            --include-package=httpx \
            --include-package=anyio \
            --include-package=websockets \
            --include-module=httptools \
            --include-module=h11 \
            --include-module=sniffio \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --assume-yes-for-downloads \
            --output-filename=client \
            --output-dir=dist-sidecar \
            --remove-output \
            client.py
          test -f dist-sidecar/client
          chmod +x dist-sidecar/client
          cp dist-sidecar/client "dist-sidecar/${{ matrix.asset }}"
          shasum -a 256 "dist-sidecar/${{ matrix.asset }}" | awk '{print $1 "  ${{ matrix.asset }}"}' \
            > "dist-sidecar/${{ matrix.asset }}.sha256"
          ls -la dist-sidecar/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.id }}
          path: |
            dist-sidecar/${{ matrix.asset }}
            dist-sidecar/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [meta, freeze-unix]
    runs-on: ubuntu-latest
    steps:
      - name: Download unix artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: client-*
          merge-multiple: true

      - name: List assets
        run: find out -type f -ls

      - name: Publish / update GitHub Release (unix only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: CultForge client ${{ needs.meta.outputs.tag }}
          body: |
            Sidecar companion binaries for CultForge launcher (`client.py` Nuitka freeze).

            | Platform | Asset | Built by |
            |----------|-------|----------|
            | Linux x86_64 | `client-linux-x86_64` | GitHub Actions |
            | macOS arm64 | `client-macos-arm64` | GitHub Actions |
            | macOS x86_64 | `client-macos-x86_64` | GitHub Actions |
            | Windows x86_64 | `client.exe` | **Manual** — `npm run sidecar:freeze` then upload |

            Pin this tag in `src/data/companions.compat.json`.

            ```bash
            # Windows (after local freeze)
            gh release upload ${{ needs.meta.outputs.tag }} dist-sidecar/client.exe \
              --repo cultforge/launcher --clobber
            ```
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
