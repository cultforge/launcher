name: Build client (Nuitka)

# Phase 2 — freeze client.py for Linux + macOS and attach to a client-v* release.
# Runs entirely on GitHub-hosted runners (safe to close your laptop).
# Windows is NOT built here: freeze locally and upload client.exe manually.
#
# Default matrix skips macos-13 (Intel) because runners often queue for hours.
# Pass platforms=linux,macos-arm,macos-intel to include it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (client-v0.1.0)"
        required: true
        default: "client-v0.1.0"
      platforms:
        description: "Comma list: linux, macos-arm, macos-intel"
        required: true
        default: "linux,macos-arm"
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import json, os

          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              tag = os.environ.get("INPUT_TAG") or "client-v0.1.0"
              raw = os.environ.get("INPUT_PLATFORMS") or "linux,macos-arm"
          else:
              tag = os.environ["REF_NAME"]
              # Tag pushes: reliable pair only (skip scarce macos-13).
              raw = "linux,macos-arm"

          if not tag.startswith("client-v"):
              raise SystemExit(f"Tag must look like client-v0.1.0 (got: {tag})")

          want = {p.strip() for p in raw.split(",") if p.strip()}
          rows = [
              {
                  "key": "linux",
                  "id": "linux-x86_64",
                  "os": "ubuntu-22.04",
                  "asset": "client-linux-x86_64",
              },
              {
                  "key": "macos-arm",
                  "id": "macos-arm64",
                  "os": "macos-latest",
                  "asset": "client-macos-arm64",
              },
              {
                  "key": "macos-intel",
                  "id": "macos-x86_64",
                  "os": "macos-13",
                  "asset": "client-macos-x86_64",
              },
          ]
          include = [r for r in rows if r["key"] in want]
          if not include:
              raise SystemExit(f"No platforms selected from {sorted(want)}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tag={tag}\n")
              f.write(f"include={json.dumps(include)}\n")
          print("tag:", tag)
          print("include:", include)
          PY

  freeze-unix:
    needs: meta
    if: needs.meta.outputs.include != '[]'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.include) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build tools (Linux)
        if: matrix.id == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache patchelf

      - name: Install Nuitka deps
        run: |
          python -m pip install -U pip wheel
          python -m pip install nuitka ordered-set zstandard
          python -m pip install -r requirements.txt sniffio

      - name: Freeze client (Nuitka onefile)
        run: |
          set -euo pipefail
          mkdir -p dist-sidecar
          python -m nuitka \
            --lto=yes \
            --standalone \
            --onefile \
            --include-package=ctfgsdk \
            --include-package=uvicorn \
            --include-package=fastapi \
            --include-package=starlette \
            --include-package=pydantic \
            --include-package=httpx \
            --include-package=anyio \
            --include-package=websockets \
            --include-module=httptools \
            --include-module=h11 \
            --include-module=sniffio \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --assume-yes-for-downloads \
            --output-filename=client \
            --output-dir=dist-sidecar \
            --remove-output \
            client.py
          test -f dist-sidecar/client
          chmod +x dist-sidecar/client
          cp dist-sidecar/client "dist-sidecar/${{ matrix.asset }}"
          shasum -a 256 "dist-sidecar/${{ matrix.asset }}" | awk '{print $1 "  ${{ matrix.asset }}"}' \
            > "dist-sidecar/${{ matrix.asset }}.sha256"
          ls -la dist-sidecar/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.id }}
          path: |
            dist-sidecar/${{ matrix.asset }}
            dist-sidecar/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [meta, freeze-unix]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download unix artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: client-*
          merge-multiple: true

      - name: Require at least one asset
        run: |
          set -euo pipefail
          count=$(find out -type f ! -name '*.sha256' 2>/dev/null | wc -l | tr -d ' ')
          echo "asset files: $count"
          find out -type f -ls || true
          test "$count" -ge 1

      - name: Publish / update GitHub Release (unix)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: CultForge client ${{ needs.meta.outputs.tag }}
          body: |
            Sidecar companion binaries for CultForge launcher (`client.py` Nuitka freeze).

            Runs on **GitHub Actions** (close your laptop anytime).

            | Platform | Asset | Built by |
            |----------|-------|----------|
            | Linux x86_64 | `client-linux-x86_64` | GitHub Actions |
            | macOS arm64 | `client-macos-arm64` | GitHub Actions |
            | macOS x86_64 | `client-macos-x86_64` | Optional (`macos-intel`) |
            | Windows x86_64 | `client.exe` | **Manual** local freeze + upload |

            Pin this tag in `src/data/companions.compat.json`.
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
