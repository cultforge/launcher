[[permission]]
identifier = "allow-secret-has"
description = "Check whether an assistant API key exists in the OS keyring"
commands.allow = ["secret_has"]

[[permission]]
identifier = "allow-secret-set"
description = "Store an assistant API key in the OS keyring (never uploaded)"
commands.allow = ["secret_set"]

[[permission]]
identifier = "allow-secret-clear"
description = "Remove an assistant API key from the OS keyring"
commands.allow = ["secret_clear"]

[[permission]]
identifier = "allow-secret-status"
description = "Report which assistant API key slots are populated"
commands.allow = ["secret_status"]

[[permission]]
identifier = "allow-local-assistant-chat"
description = "Chat with Gemini/OpenAI using a keyring-stored API key (key stays in Rust)"
commands.allow = ["local_assistant_chat"]

[[set]]
identifier = "local-secrets"
description = "OS keyring secrets and local assistant chat"
permissions = [
  "allow-secret-has",
  "allow-secret-set",
  "allow-secret-clear",
  "allow-secret-status",
  "allow-local-assistant-chat",
]
