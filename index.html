<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/logo-disc.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CultForge</title>
        <!-- Critical boot paint: paints before Vite/React CSS so the window is never blank white. -->
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #000;
                color: #e8efe9;
                overflow: hidden;
            }
            #origin {
                width: 100%;
                height: 100%;
                background: #000;
            }
            #cf-boot {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.75rem;
                background: #000;
                font-family: system-ui, Segoe UI, sans-serif;
                user-select: none;
            }
            #cf-boot .mark {
                font-size: 1.35rem;
                font-weight: 800;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
            #cf-boot .mark span {
                color: #3dff8b;
            }
            #cf-boot .sub {
                font-size: 0.7rem;
                letter-spacing: 0.35em;
                text-transform: uppercase;
                opacity: 0.55;
            }
            #cf-boot .spin {
                width: 1.75rem;
                height: 1.75rem;
                border-radius: 999px;
                border: 2px solid rgba(255, 255, 255, 0.12);
                border-top-color: #3dff8b;
                animation: cf-spin 0.85s linear infinite;
            }
            @keyframes cf-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #cf-boot .spin {
                    animation: none;
                    border-top-color: rgba(255, 255, 255, 0.35);
                }
            }
        </style>
    </head>

    <body>
        <div id="origin">
            <div id="cf-boot" aria-busy="true" aria-label="Loading CultForge">
                <div class="mark">Cult<span>Forge</span></div>
                <div class="spin" aria-hidden="true"></div>
                <div class="sub">Starting</div>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
